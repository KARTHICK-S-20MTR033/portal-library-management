<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <div class="navbar">
        <h2>📚 Library Management</h2>
        <button class="logout-btn" id="logout-btn">
            Logout
        </button>
    </div>

    <div class="hero-section">
        <h1 id="welcome-msg">Welcome Student 👋</h1>
        <p>Explore books available in the library and manage your borrowings.</p>
    </div>

    <div class="main-content">
        
        <div class="section-container">
            <h2 class="main-heading">📖 Available Books</h2>
            <div class="books-container" id="books-container">
                </div>
        </div>

        <hr style="border: 0; height: 1px; background: #e2e8f0; margin: 40px 50px;">

        <div class="section-container">
            <h2 class="main-heading">⏳ Borrowing History</h2>
            <div class="books-container" id="borrowed-books-container">
                </div>
        </div>

    </div>

    <script src="dashboard.js"></script>
</body>

</html>
